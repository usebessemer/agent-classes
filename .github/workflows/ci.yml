name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 = the requires-python floor; 3.14 = the dev version.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The [test] extra pins pytest + pytest-asyncio; asyncio_mode = auto is in
      # pyproject, so the async suite runs self-contained with no extra config.
      - name: Install
        run: pip install -e ".[test]"

      - name: Run tests
        run: pytest

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Type-check against the requires-python floor — the minimum we ship.
          python-version: "3.12"

      # The [typecheck] extra pins mypy exactly so local and CI agree; a floating
      # mypy is what silently reclassified [arg-type] -> [call-overload] in #34.
      - name: Install
        run: pip install -e ".[typecheck]"

      - name: Type-check
        run: mypy bookkeeper/ jr_analyst/
